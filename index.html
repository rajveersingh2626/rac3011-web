<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#D81B60" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rotaract 3011" />
    <link rel="apple-touch-icon" href="/images.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Rotaract District Organization 3011 | Official Website</title>
    <meta name="description" content="Official website of Rotaract District Organization 3011, uniting 85+ youth-led clubs and thousands of changemakers across Delhi & NCR under Rotary International." />
    <meta name="keywords" content="Rotaract, District 3011, Rotary International, Delhi, NCR, youth leadership, fellowship, community service, social impact" />
    <meta name="author" content="Rotaract District Organization 3011" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rotaract District Organization 3011" />
    <meta property="og:title" content="Rotaract District Organization 3011 | Delhi & NCR" />
    <meta property="og:description" content="Uniting clubs and thousands of young leaders across Delhi NCR to drive sustainable social change through fellowship and service excellence." />
    <meta property="og:image" content="/images.webp" />
    <meta property="og:url" content="https://rotaract3011.org" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rotaract District Organization 3011" />
    <meta name="twitter:description" content="Service Above Self • Fellowship Through Action across Delhi & NCR." />
    <meta name="twitter:image" content="/images.webp" />

    <!-- Preload Rotary Wheel Anchor Image for Instant Initial Render -->
    <link rel="preload" as="image" href="/images.webp" type="image/png" fetchpriority="high" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Dancing+Script:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://api.rotaract3011.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.rotaract3011.org" />
    <!-- Leaflet styles -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      try {
        localStorage.setItem('rac3011.theme', 'light');
        document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
