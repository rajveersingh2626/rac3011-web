map $host $spa_root_index {
  default                     index.html;
  rotaract3011.org            home.html;
  www.rotaract3011.org        home.html;
  staging.rotaract3011.org    home.html;
  testing.rotaract3011.org    home.html;
  localhost                   home.html;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.ufs.sh https://utfs.io https://*.tile.openstreetmap.org https://drive.google.com https://*.googleusercontent.com https://photos.google.com https://*.ggpht.com https://i.ytimg.com; media-src 'self' https://drive.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; connect-src 'self' https://api.rotaract3011.org https://*.ingest.uploadthing.com https://*.ufs.sh https://*.sentry.io; worker-src 'self'; manifest-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    try_files $uri =404;
  }

  # Root only: $spa_root_index picks home.html (prerendered) on main-surface hostnames, index.html (plain SPA) everywhere else - see the map above.
  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /$spa_root_index /index.html;
  }

  # Proxy API endpoints if called relatively or directly on the web origin
  location ~ ^/(auth|second-factor|trusted-devices|me|members|clubs|club-facts|announcements|reports|points|settings|public|health|sister-club-requests|drr-bookings|feedback|link-health|mission3011|drishti|ride|careerbridge|rcl|audit|rbac)(/|$) {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.rotaract3011.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    # No $uri/ here: prerendering emits both resources.html and a resources/ dir, and matching the
    # bare directory 403s (nothing indexable inside it) instead of falling through to the SPA.
    try_files $uri $uri.html /index.html;
  }
}

server {
  listen 80;
  listen 443 ssl;
  server_name api.rotaract3011.org;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 50M;

  location / {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
