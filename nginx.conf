# 4. Pre-Production Static Origin Server (Running inside rac3011-web-preprod)
server {
  listen 80;
  server_name preprod-origin;
  root /usr/share/nginx/html;
  index home.html index.html;

  location / {
    try_files $uri $uri/ /home.html /index.html;
  }
}
