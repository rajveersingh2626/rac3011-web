map $host $spa_root_index {
  default                     index.html;
  rotaract3011.org            home.html;
  www.rotaract3011.org        home.html;
  staging.rotaract3011.org    home.html;
  testing.rotaract3011.org    home.html;
  preprod-origin              home.html;
  localhost                   home.html;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 1. Catch-all Default Server: Disabled for unrecognized hosts except testing subdomains
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # If accessed via an unconfigured testing subdomain, route to testing apex; otherwise return 404
  if ($host ~* \.testing\.rotaract3011\.org$) {
    return 301 https://testing.rotaract3011.org$request_uri;
  }

  return 404;
}

# 2. Main District Production Apex & Portal (Blocked / Disabled)
server {
  listen 80;
  listen 443 ssl;
  server_name rotaract3011.org www.rotaract3011.org portal.rotaract3011.org;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  return 404;
}

# 3. Active Project Subdomain Production Surfaces (CareerBridge, RCL, Drishti, Mission 3011)
server {
  listen 80;
  listen 443 ssl;
  server_name careerbridge.rotaract3011.org rcl.rotaract3011.org drishti.rotaract3011.org mission3011.rotaract3011.org localhost;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https: blob: data: https://drive.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; connect-src 'self' https://api.rotaract3011.org https://*.ingest.uploadthing.com https://*.ufs.sh https://*.sentry.io; worker-src 'self'; manifest-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ^~ /assets/ {
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    try_files $uri =404;
  }

  # Proxy API endpoints if called relatively or directly on the web origin
  location ~ ^/(auth|auth-lookup|second-factor|trusted-devices|me|members|clubs|club-facts|zones|skill-tags|district-team|past-drrs|announcements|reports|report-schemas|report-requests|points|point-categories|point-rules|settings|public|health|sister-club-requests|drr-bookings|feedback|link-health|asset-links|mission3011|drishti|ride|careerbridge|rcl|audit|rbac|roles|user-roles|permissions|files|enquiries|content-blocks)(/|$) {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.rotaract3011.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri /index.html;
  }
}

