map $host $spa_root_index {
  default                     index.html;
  rotaract3011.org            home.html;
  www.rotaract3011.org        home.html;
  staging.rotaract3011.org    home.html;
  testing.rotaract3011.org    home.html;
  preprod-origin              home.html;
  localhost                   home.html;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 1. Catch-all Default Server: Disabled for unrecognized hosts except testing subdomains
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # If accessed via an unconfigured testing subdomain, route to testing apex; otherwise return 404
  if ($host ~* \.testing\.rotaract3011\.org$) {
    return 301 https://testing.rotaract3011.org$request_uri;
  }

  return 404;
}

# 2. Main District Production Surfaces (Rolled back & disabled)
server {
  listen 80;
  listen 443 ssl;
  server_name rotaract3011.org www.rotaract3011.org portal.rotaract3011.org careerbridge.rotaract3011.org rcl.rotaract3011.org drishti.rotaract3011.org mission3011.rotaract3011.org ride.rotaract3011.org delhimerijaan.rotaract3011.org;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  return 404;
}

server {
  listen 80;
  listen 443 ssl;
  server_name api.rotaract3011.org;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 50M;

  location / {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

server {
  listen 80;
  listen 443 ssl;
  server_name testing.rotaract3011.org ~^testing\..+\.rotaract3011\.org$;
  ssl_certificate /etc/nginx/ssl/origin.crt;
  ssl_certificate_key /etc/nginx/ssl/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 50M;

  location ~ ^/(auth|auth-lookup|second-factor|trusted-devices|me|members|clubs|club-facts|zones|skill-tags|district-team|past-drrs|announcements|reports|report-schemas|report-requests|points|point-categories|point-rules|settings|public|health|sister-club-requests|drr-bookings|feedback|link-health|asset-links|mission3011|drishti|ride|careerbridge|rcl|audit|rbac|roles|user-roles|permissions|files|enquiries|content-blocks)(/|$) {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.rotaract3011.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    set $preprod_upstream http://web-preprod:80;
    proxy_pass $preprod_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host preprod-origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

# 4. Pre-Production Static Origin Server (Running inside rac3011-web-preprod)
server {
  listen 80;
  server_name preprod-origin;
  root /usr/share/nginx/html;
  index home.html index.html;

  location / {
    try_files $uri $uri/ /home.html /index.html;
  }
}
